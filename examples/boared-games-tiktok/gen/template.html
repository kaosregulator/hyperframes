<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #07020f;
        --ink: #ffffff;
        --yellow: #ffe14d;
        --pink: #ff3ea5;
        --teal: #19e3d2;
        --accent: {{ACCENT}};
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
        font-family: "Archivo Black", sans-serif;
      }
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .cam video {
        position: absolute;
        top: 0;
        left: -1166px;
        width: 3413px;
        height: 1920px;
        object-fit: cover;
      }
      .layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .center {
        position: absolute;
        left: 60px;
        right: 60px;
        text-align: center;
        color: var(--ink);
      }
      .big {
        font-size: 150px;
        line-height: 0.92;
        letter-spacing: -0.03em;
        text-shadow:
          -5px 0 0 rgba(255, 62, 165, 0.85),
          5px 0 0 rgba(25, 227, 210, 0.85),
          0 10px 40px rgba(0, 0, 0, 0.75);
      }
      .mid {
        font-size: 104px;
        line-height: 0.95;
        letter-spacing: -0.02em;
        text-shadow:
          -4px 0 0 rgba(255, 62, 165, 0.8),
          4px 0 0 rgba(25, 227, 210, 0.8),
          0 8px 30px rgba(0, 0, 0, 0.8);
      }
      .sub {
        font-family: "Space Mono", monospace;
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
      }
      .w {
        display: inline-block;
      }
      .sticker {
        display: inline-block;
        background: var(--yellow);
        color: #120720;
        padding: 18px 34px 10px;
        border-radius: 14px;
        font-size: 96px;
        line-height: 1;
        box-shadow:
          10px 10px 0 #120720,
          0 20px 50px rgba(0, 0, 0, 0.6);
      }
      .sticker.pink {
        background: var(--pink);
        color: #fff;
      }
      .sticker.teal {
        background: var(--teal);
      }
      .hud {
        position: absolute;
        font-family: "Space Mono", monospace;
        font-weight: 700;
        color: #fff;
        font-size: 40px;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.6), 0 3px 8px rgba(0, 0, 0, 0.9);
      }
      #scan {
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.22) 0px,
          rgba(0, 0, 0, 0.22) 2px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0) 5px
        );
        opacity: 0.55;
      }
      #vig {
        background: radial-gradient(
          ellipse at 50% 45%,
          rgba(0, 0, 0, 0) 45%,
          rgba(0, 0, 0, 0.55) 100%
        );
      }
      #flash {
        background: #fff;
        opacity: 0;
      }
      #dip {
        background: #000;
        opacity: 0;
      }
      .polaroid {
        position: absolute;
        width: 380px;
        background: #fffdf4;
        padding: 18px 18px 64px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      }
      .polaroid img {
        display: block;
        width: 344px;
        height: 300px;
        object-fit: cover;
      }
      .polaroid span {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        text-align: center;
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 30px;
        color: #222;
      }
      .slot {
        position: relative;
        height: 120px;
        overflow: hidden;
      }
      .slot-reel {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
      }
      .slot-reel div {
        height: 120px;
        line-height: 120px;
        font-size: 104px;
        color: var(--yellow);
        text-shadow:
          -4px 0 0 rgba(255, 62, 165, 0.8),
          4px 0 0 rgba(25, 227, 210, 0.8),
          0 8px 30px rgba(0, 0, 0, 0.8);
      }
      .streak {
        position: absolute;
        height: 10px;
        border-radius: 5px;
        background: linear-gradient(90deg, rgba(255, 225, 77, 0), #ffe14d);
      }
      #logo .l {
        display: inline-block;
      }
      #cta {
        display: inline-block;
        margin-top: 40px;
        padding: 26px 46px;
        border-radius: 999px;
        background: var(--pink);
        color: #fff;
        font-size: 50px;
        box-shadow: 0 0 60px rgba(255, 62, 165, 0.75);
      }
    
      .shot { position: absolute; inset: 0; overflow: hidden; }
      .cam img.bleed { position: absolute; top: 0; left: -1166px; width: 3413px; height: 1920px; object-fit: cover; }
      .cardwrap { position: absolute; left: 30px; width: 1020px; height: 574px; border-radius: 28px; overflow: hidden; border: 6px solid #fff; box-shadow: 0 0 0 6px #120720, 0 40px 90px rgba(0,0,0,0.75), 0 0 80px rgba(255,62,165,0.35); }
      .cardwrap img.card { width: 100%; height: 100%; object-fit: cover; display: block; }
      .cam img.poster { position: absolute; left: 190px; width: 700px; height: auto; border-radius: 10px; box-shadow: 0 40px 90px rgba(0,0,0,0.75); }
      .slot { position: relative; height: 130px; overflow: hidden; margin-top: 10px; }
      .slot-reel div { height: 130px; line-height: 130px; font-size: 100px; color: var(--accent); text-shadow: -4px 0 0 rgba(255,62,165,.8), 4px 0 0 rgba(25,227,210,.8), 0 8px 30px rgba(0,0,0,.8); }
      .counter { font-size: 150px; line-height: 150px; color: #fff; text-shadow: -5px 0 0 rgba(255,62,165,.85), 5px 0 0 rgba(25,227,210,.85), 0 10px 40px rgba(0,0,0,.75); }
      .wheel { display: inline-block; height: 150px; overflow: hidden; vertical-align: top; }
      .wheel-in { display: block; }
      .wheel-in i { display: block; font-style: normal; height: 150px; }
      .cta { display: inline-block; padding: 26px 46px; border-radius: 999px; background: var(--pink); color: #fff; font-size: 50px; box-shadow: 0 0 60px rgba(255,62,165,.75); }
      #root .bg-ground { position: absolute; inset: 0; background: var(--ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1080" data-height="1920">
{{SHOTS}}
      <div id="tint" class="layer clip" data-start="{{TINT_START}}" data-duration="{{TINT_DUR}}" data-track-index="1" data-layout-ignore style="z-index: 50; background: linear-gradient(180deg, rgba(7,2,15,0.25), rgba(40,6,60,0.8))"></div>
      <div id="scan" class="layer" data-layout-ignore style="z-index: 52"></div>
      <div id="vig" class="layer" data-layout-ignore style="z-index: 53"></div>
      <div id="hud-play" class="hud" style="left: 70px; top: 200px; z-index: 55">&#9654; PLAY</div>
      <div id="hud-rec" class="hud" style="left: 70px; top: 256px; z-index: 55; color: #ff4d4d; font-size: 32px">&#9679; REC</div>
      <div id="hud-date" class="hud" style="left: 70px; top: 1250px; z-index: 55; font-size: 34px">{{HUD_LABEL}}</div>
{{TEXTS}}
      <div id="dip" class="layer" data-layout-ignore style="z-index: 90"></div>
      <div id="flash" class="layer" data-layout-ignore style="z-index: 91"></div>
      {{MUSIC}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
{{JS}}
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
